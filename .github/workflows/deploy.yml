name: Publish Joy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out blog
        uses: actions/checkout@v4
      - name: Prepare website files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s posts/first-page.html
          mkdir -p _site
          cp index.html styles.css _site/
          cp -R posts _site/posts
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
